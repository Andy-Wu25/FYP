[project]
name = "code-similarity-tool"
version = "0.1.0"
description = "Git-integrated code similarity detector using embeddings"
authors = [
  { name = "Andy Wu" }
]
requires-python = ">=3.11"
dependencies = [
  "voyageai==0.3.5",
  "chromadb==1.1.1",
  "tree-sitter==0.23.2",
  "tree-sitter-language-pack==0.9.1",
  "tree-sitter-python==0.25.0",
  "tree-sitter-java==0.23.5",
  "pre-commit>=3.0",
]

[project.scripts]
code-sim-index = "code_similarity_tool.index:main"
code-sim-hook = "code_similarity_tool.code_similarity:main"
code-sim-init-ignore = "code_similarity_tool.cli:init_ignore"  # optional helper

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"