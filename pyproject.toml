[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code-similarity-tool"
version = "0.3.1"
description = "Org-wide private/public code similarity detector with Tree-sitter, vLLM, and ChromaDB"
requires-python = ">=3.11"
authors = [{ name = "Andy Wu" }]

dependencies = [
  "chromadb==1.1.1",
  "tree-sitter-language-pack==0.9.1",
  "identify>=2.6.0",
  "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]
bot = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",
  "httpx>=0.27.0",
  "PyJWT>=2.8.0",
  "cryptography>=42.0.0",
]

[project.scripts]
code-sim-index         = "code_similarity_tool.index:main"
code-sim-index-public  = "code_similarity_tool.public_index:main"
code-sim-update        = "code_similarity_tool.update:main"
code-sim-check         = "code_similarity_tool.code_similarity:main"
code-sim-check-private = "code_similarity_tool.code_similarity:main"
code-sim-check-self    = "code_similarity_tool.check_self:main"
code-sim-check-public  = "code_similarity_tool.check_public:main"
code-sim-ignore        = "code_similarity_tool.cli:init_ignore"
code-sim-install-hook  = "code_similarity_tool.cli:install_git_hook"
code-sim-bot-serve     = "code_similarity_tool.bot_serve:main"

[tool.setuptools]
packages = ["code_similarity_tool", "code_similarity_tool.bot"]
