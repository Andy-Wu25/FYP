[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code-similarity-tool"
version = "0.2.0"
description = "Git-integrated, org-wide code similarity detector using Tree-sitter, vLLM, and ChromaDB"
requires-python = ">=3.11"
authors = [{ name = "Andy Wu" }]

dependencies = [
  "chromadb==1.1.1",
  "tree-sitter-language-pack==0.9.1",
  "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
code-sim-index        = "code_similarity_tool.index:main"
code-sim-update       = "code_similarity_tool.update:main"
code-sim-check        = "code_similarity_tool.code_similarity:main"
code-sim-ignore       = "code_similarity_tool.cli:init_ignore"
code-sim-install-hook = "code_similarity_tool.cli:install_git_hook"

[tool.setuptools]
packages = ["code_similarity_tool"]
